<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta · padrão pra quem lê sem JS (prévia de link). Com JS, as tags data-route-meta
         saem e o RouteMeta põe título, descrição, canonical, og:title e og:url da rota -->
    <title data-route-meta>Viver de IA · Design System</title>
    <meta name="description" data-route-meta content="Design System Viver de IA — marca editorial, navy profundo, vidro líquido e tipografia Geist. Mais de 100 páginas vivas, 46 componentes React e 14 emails de produção." />
    <meta name="theme-color" content="#0A1F3B" />
    <meta name="color-scheme" content="light" />

    <!-- Favicon · ícones (light + dark + apple touch) -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
    <link rel="mask-icon" href="/favicon.png" color="#0A1F3B" />

    <!-- Open Graph · LinkedIn / WhatsApp / Slack / Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Viver de IA · Design System" />
    <meta property="og:title" data-route-meta content="Design System · Viver de IA" />
    <meta property="og:description" content="Marca editorial, engenharia de precisão. Tokens, 46 componentes React, 14 emails de produção e as regras da marca." />
    <meta property="og:image" content="https://viver-de-ia-ds.vercel.app/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Viver de IA · Design System — fundo claro, lockup navy e a frase Marca editorial, engenharia de precisão." />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@viverdeia" />
    <meta name="twitter:title" content="Design System · Viver de IA" />
    <meta name="twitter:description" content="Marca editorial, engenharia de precisão. Tokens, 46 componentes React e as regras da marca." />
    <meta name="twitter:image" content="https://viver-de-ia-ds.vercel.app/og-cover.png" />

    <!-- Preconnect a fonts (caso adicionemos Geist via Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <script>
      /* Theme bootstrap — runs before paint to avoid FOUC */
      (function () {
        try {
          // Light é o padrão da marca · só respeita 'dark' se usuário escolheu explicitamente
          var stored = localStorage.getItem('via-theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'light';
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
